name: Lint

on:
    workflow_call

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '26'
                    package-manager-cache: false

            -   name: Install Dependencies
                run: npm install

            -   name: Lint
                run: npm run lint
